name: Release

# Publica uma versão sempre que uma tag "v*" é enviada (por exemplo v1.20.1).
# O executável é compilado aqui, no GitHub, a partir do código-fonte público deste repositório,
# e a Release recebe também o hash SHA-256 do arquivo para qualquer pessoa conferir.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Conferir se a tag bate com a versão do projeto
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG.TrimStart('v')
          $xml = [xml](Get-Content Deceive/Deceive.csproj)
          $versao = @($xml.Project.PropertyGroup.AssemblyVersion | Where-Object { $_ })[0]
          $esperada = $versao -replace '\.0$', ''
          Write-Host "Tag: $tag | Versão no projeto: $esperada"
          if ($tag -ne $esperada) {
            throw "A tag v$tag não bate com a versão do projeto ($esperada). Ajuste AssemblyVersion em Deceive/Deceive.csproj."
          }

      - name: Compilar
        run: dotnet build Deceive/Deceive.csproj -c Release

      - name: Gerar hash e publicar a Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item Deceive/bin/Release/net472/SkoreLoBoostStatus.exe dist/SkoreLoBoostStatus.exe
          $hash = (Get-FileHash dist/SkoreLoBoostStatus.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SkoreLoBoostStatus.exe" | Out-File -FilePath dist/SkoreLoBoostStatus.exe.sha256 -Encoding ascii

          $notas = @"
          App gratuito para aparecer offline ou mobile no chat da Riot.

          **Como instalar:** baixe o ``SkoreLoBoostStatus.exe`` abaixo e abra. Se o Windows mostrar "O Windows protegeu o computador", clique em "Mais informações" e depois em "Executar assim mesmo". O app ainda não tem assinatura digital paga.

          **Conferir o arquivo (opcional):** este executável foi compilado pelo GitHub a partir do código-fonte deste repositório. O hash SHA-256 esperado é:

          ``$hash``

          Para conferir no PowerShell: ``Get-FileHash .\SkoreLoBoostStatus.exe -Algorithm SHA256``

          Baseado no Deceive (molenzwiebel), licença GPL-3.0.
          "@
          $notas = ($notas -split "`n" | ForEach-Object { $_.TrimStart() }) -join "`n"
          Set-Content -Path notas.md -Value $notas -Encoding utf8

          gh release create $env:TAG dist/SkoreLoBoostStatus.exe dist/SkoreLoBoostStatus.exe.sha256 --title "SkoreLoBoost Status $env:TAG" --notes-file notas.md --verify-tag
